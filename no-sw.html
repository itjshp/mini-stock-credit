<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khaikhong No Service Worker</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;background:#e8f7f3;color:#0f2530}
    .card{width:min(520px,calc(100% - 32px));background:#fff;border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(15,23,42,.12)}
    a{display:inline-flex;border-radius:999px;background:#008b7a;color:#fff;text-decoration:none;padding:12px 18px;font-weight:900}
  </style>
</head>
<body>
  <div class="card">
    <h1>กำลังเปิด Khaikhong แบบไม่ผ่าน Cache...</h1>
    <p>ระบบกำลังปิด Service Worker และเปิดแอปใหม่</p>
    <a id="openLink" href="./index.html?pinOff=1&noSW=1">เปิดแอปทันที</a>
  </div>
<script>
(async function(){
  try{
    sessionStorage.setItem("khaikhongPinUnlocked","1");
    localStorage.setItem("khaikhongPinRemoved","1");
    if("caches" in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    if(navigator.serviceWorker?.getRegistrations){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  const url = "./index.html?pinOff=1&noSW=1&t=" + Date.now();
  document.getElementById("openLink").href = url;
  setTimeout(()=>location.href=url, 700);
})();
</script>
</body>
</html>
